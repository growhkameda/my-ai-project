name: Spec Quality Check

on:
  pull_request:
    paths:
      - 'docs/specs/**.md'

jobs:
  validate-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas tabulate

      - name: Run Spec Validation
        shell: python
        run: |
          import glob
          import sys
          import re

          # 判定ロジック
          files = glob.glob("docs/specs/*.md")
          error_count = 0

          for file in files:
              print(f"Checking {file}...")
              with open(file, 'r', encoding='utf-8') as f:
                  content = f.read()
                  
                  # Rule 1: テーブル形式か？
                  if "| ID |" not in content:
                      print(f"❌ Error: {file} is not in table format.")
                      error_count += 1
                  
                  # Rule 2: ID形式 (XXX-000) チェック
                  if not re.search(r'[A-Z]+-\d{3}', content):
                      print(f"❌ Error: {file} contains invalid ID format.")
                      error_count += 1
                      
                  # Rule 3: 「要確認」が残っていないか？
                  if "要確認" in content:
                      print(f"⚠️ Warning: {file} contains unresolved '要確認'.")
                      # Warningはエラーにせず、ログに残すだけにする運用も可

          if error_count > 0:
              sys.exit(1)
          else:
              print("✅ All checks passed!")